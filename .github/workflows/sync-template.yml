name: Sync Template Branch

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday at midnight UTC
  workflow_dispatch:
  push:
    branches: [automation]

jobs:
  sync-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream repository
        uses: actions/checkout@v4
        with:
          repository: modelcontextprotocol/servers
          ref: main
          path: upstream

      - name: Check for changes in src/everything directory
        id: check-changes
        run: |
          cd upstream
          # Get the latest commit hash that touched the src/everything directory
          LATEST_EVERYTHING_COMMIT=$(git log -1 --format="%H" -- src/everything)
          echo "latest_commit=$LATEST_EVERYTHING_COMMIT" >> $GITHUB_OUTPUT
          
          # Check if this commit is different from our last sync
          # (This will always trigger on first run, which is fine)
          echo "New commits found in src/everything directory: $LATEST_EVERYTHING_COMMIT"

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY_TEMPLATE_PUSHER }}

      - name: Checkout template branch from our fork
        run: |
          git clone git@github.com:${{ github.repository }}.git template
          cd template
          git checkout template || git checkout --orphan template

      - name: Check if sync is needed and sync files
        shell: pwsh
        run: |
          Set-Location template
          
          # Check current sync info
          $currentCommit = ""
          if (Test-Path ".mcp-sync-info") {
            $syncInfo = Get-Content ".mcp-sync-info" | ConvertFrom-Json
            $currentCommit = $syncInfo.commit
          }
          
          $latestCommit = "${{ steps.check-changes.outputs.latest_commit }}"
          
          if ($currentCommit -eq $latestCommit) {
            Write-Host "No sync needed - already at commit $currentCommit"
            exit 0
          }
          
          Write-Host "Sync needed - current: $currentCommit, latest: $latestCommit"
          
          # Remove everything except .git
          Get-ChildItem -Path "." -Exclude ".git" | Remove-Item -Recurse -Force
          
          # Copy everything from upstream/src/everything to template root
          Copy-Item -Path "../upstream/src/everything/*" -Destination "." -Recurse -Force
          
          # Create sync info file
          $syncInfo = @{
            source = "https://github.com/modelcontextprotocol/servers"
            commit = $latestCommit
            synced = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            path = "src/everything"
          }
          $syncInfo | ConvertTo-Json | Set-Content ".mcp-sync-info"
          
          Write-Host "Sync completed"

      - name: Commit and push changes
        run: |
          cd template
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add, commit and push changes
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Auto-sync template from upstream src/everything (commit: ${{ steps.check-changes.outputs.latest_commit }})"
            git push origin template
          else
            echo "No changes to commit"
          fi